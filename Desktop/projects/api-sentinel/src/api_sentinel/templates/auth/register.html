{% extends "base.html" %}

{% block title %}Register - API Sentinel{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
        
        <form action="/auth/register" method="post" hx-post="/auth/register" hx-target="body" hx-swap="innerHTML">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" minlength="3">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
                <small>Minimum 8 characters</small>
            </div>
            
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="viewer">Viewer (read-only)</option>
                    <option value="admin">Admin (full access)</option>
                </select>
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; color: var(--pico-muted-color);">
            Already have an account? <a href="/ui/login">Login</a>
        </p>
    </div>
</div>
{% endblock %}
